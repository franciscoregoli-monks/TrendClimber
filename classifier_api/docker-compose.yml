services:
  classifier-api:
    build: .
    image: trend-classifier-api:latest
    ports:
      - "8080:8000"
    environment:
      PORT: "8000"
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
